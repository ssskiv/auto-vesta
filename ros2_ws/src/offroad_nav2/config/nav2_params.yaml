map_server:
  ros__parameters: {use_sim_time: true, yaml_filename: robocross.yaml}
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [wait]
    wait: {plugin: nav2_behaviors/Wait}
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names: [nav2_compute_path_to_pose_action_bt_node, nav2_compute_path_through_poses_action_bt_node, nav2_follow_path_action_bt_node,
      nav2_wait_action_bt_node, nav2_clear_costmap_service_bt_node, nav2_is_stuck_condition_bt_node, nav2_goal_reached_condition_bt_node, nav2_goal_updated_condition_bt_node,
      nav2_globally_updated_goal_condition_bt_node, nav2_is_path_valid_condition_bt_node, nav2_initial_pose_received_condition_bt_node, nav2_rate_controller_bt_node,
      nav2_distance_controller_bt_node, nav2_speed_controller_bt_node, nav2_truncate_path_action_bt_node, nav2_truncate_path_local_action_bt_node,
      nav2_goal_updater_node_bt_node, nav2_recovery_node_bt_node, nav2_pipeline_sequence_bt_node, nav2_round_robin_node_bt_node, nav2_transform_available_condition_bt_node,
      nav2_time_expired_condition_bt_node, nav2_distance_traveled_condition_bt_node]
    default_nav_to_pose_bt_xml: nav_forward_only.xml
    default_nav_through_poses_bt_xml: nav_through_poses_forward_only.xml
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: 'nav2_waypoint_follower::WaitAtWaypoint', enabled: true, waypoint_pause_duration: 0}
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [4.5, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-3.0, 0.0, -2.0]
    odom_topic: /odometry/local
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_nav
    transform_tolerance: 0.3
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [StopZone, SlowZone]
    StopZone:
      type: polygon
      points: [4.7, 0.85, 4.7, -0.85, 3.75, -0.85, 3.75, 0.85]
      action_type: stop
      min_points: 4
      visualize: true
      polygon_pub_topic: stop_polygon
      enabled: true
    SlowZone:
      type: polygon
      points: [7.5, 1.1, 7.5, -1.1, 3.75, -1.1, 3.75, 1.1]
      action_type: slowdown
      min_points: 4
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: slow_polygon
      enabled: true
    observation_sources: [stop_wall, perception_geo]
    stop_wall: {type: pointcloud, topic: /perception/stop_wall, min_height: -1.0, max_height: 3.0}
    perception_geo: {type: pointcloud, topic: /perception/points/geometric, min_height: -0.05, max_height: 2.0}
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 8.0
    node_names: [map_server, planner_server, controller_server, behavior_server, bt_navigator, waypoint_follower, velocity_smoother, collision_monitor]
