# Nav2 (Humble 1.1.x) parameters of the Vesta stack. Edit here; there is no generator any more.
#
# Forward-only everywhere (checked by test/test_forward_only.py): Smac Hybrid-A* DUBIN, Regulated Pure Pursuit with
# allow_reversing false, velocity_smoother min_velocity x = 0, BT without BackUp/Spin, collision_monitor, and the zero-clamp relay
# (config/nodes.yaml). Obstacles come from the perception clouds only (no lidar). Costmap heights are in the costmap frame:
# the ground sits at z = -base_link_height = -0.108 m (EKF 2D mode keeps base_link at z = 0).
#
# Substituted at launch (launch/navigation.launch.py): map_server.yaml_filename and the two bt_navigator behaviour-tree files
# (names only here; the full paths come from the package share directory).
#
# TODO(user): planner minimum turning radius (GridBased.minimum_turning_radius, 4.0 here; guide 4.5 / 5.2; kinematic minimum 3.87 m);
# TODO(user): semantic layer = lethal vs soft cost for non-drivable ground (decision 7.10); real footprint / vehicle numbers.
# Footprint: rear axle at the origin, x -0.88..3.68, y +-0.865 (config/vehicle.yaml); footprint_padding 0.2 m (0.12 gave barrel touches,
# 0.3 pinned the car against a barrel).
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      downsample_costmap: true
      downsampling_factor: 2
      tolerance: 3.0
      allow_unknown: true
      max_iterations: 2000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 48
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 4.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother: {max_iterations: 1000, w_smooth: 0.3, w_data: 0.2, tolerance: 1.0e-10, do_refinement: true, refinement_num: 2}
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.5, movement_time_allowance: 45.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker', xy_goal_tolerance: 1.5, yaw_goal_tolerance: 3.14}
    FollowPath: {plugin: 'nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController', desired_linear_vel: 3.0, lookahead_dist: 3.0,
      min_lookahead_dist: 2.0, max_lookahead_dist: 5.0, lookahead_time: 1.0, rotate_to_heading_angular_vel: 0.0, transform_tolerance: 0.1, use_velocity_scaled_lookahead_dist: true,
      min_approach_linear_velocity: 1.0, approach_velocity_scaling_dist: 4.0, use_collision_detection: true, max_allowed_time_to_collision_up_to_carrot: 1.0,
      use_regulated_linear_velocity_scaling: true, use_cost_regulated_linear_velocity_scaling: true, regulated_linear_scaling_min_radius: 6.0,
      regulated_linear_scaling_min_speed: 1.5, use_rotate_to_heading: false, allow_reversing: false, max_angular_accel: 3.2, cost_scaling_dist: 1.0,
      cost_scaling_gain: 1.0, inflation_cost_scaling_factor: 4.0}
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      footprint: '[[3.68, 0.865], [3.68, -0.865], [-0.88, -0.865], [-0.88, 0.865]]'
      footprint_padding: 0.2
      resolution: 0.1
      transform_tolerance: 0.3
      always_send_full_costmap: true
      use_sim_time: true
      rolling_window: true
      width: 40
      height: 40
      plugins: [vru_layer, vru_inflation, vehicle_layer, vehicle_inflation, geometric_layer, semantic_layer, inflation_layer]
      geometric_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: geometric clear
        geometric: {topic: /perception/points/geometric, data_type: PointCloud2, marking: true, clearing: false, sensor_frame: '', observation_persistence: 0.0,
          expected_update_rate: 0.0, inf_is_valid: false, obstacle_max_range: 20.0, obstacle_min_range: 0.0, raytrace_max_range: 22.0, raytrace_min_range: 0.0,
          min_obstacle_height: -0.508, max_obstacle_height: 3.0}
        clear: {topic: /perception/points/clear, data_type: PointCloud2, marking: false, clearing: true, sensor_frame: '', observation_persistence: 0.0,
          expected_update_rate: 0.0, inf_is_valid: false, obstacle_max_range: 20.0, obstacle_min_range: 0.0, raytrace_max_range: 22.0, raytrace_min_range: 0.0,
          min_obstacle_height: -0.508, max_obstacle_height: 3.0}
      vru_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: vru clear
        vru: {topic: /perception/points/vru, data_type: PointCloud2, marking: true, clearing: false, sensor_frame: '', observation_persistence: 0.0,
          expected_update_rate: 0.0, inf_is_valid: false, obstacle_max_range: 20.0, obstacle_min_range: 0.0, raytrace_max_range: 22.0, raytrace_min_range: 0.0,
          min_obstacle_height: -0.508, max_obstacle_height: 3.0}
        clear: {topic: /perception/points/clear, data_type: PointCloud2, marking: false, clearing: true, sensor_frame: '', observation_persistence: 0.0,
          expected_update_rate: 0.0, inf_is_valid: false, obstacle_max_range: 20.0, obstacle_min_range: 0.0, raytrace_max_range: 22.0, raytrace_min_range: 0.0,
          min_obstacle_height: -0.508, max_obstacle_height: 3.0}
      vehicle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: vehicle clear
        vehicle: {topic: /perception/points/vehicle, data_type: PointCloud2, marking: true, clearing: false, sensor_frame: '', observation_persistence: 0.0,
          expected_update_rate: 0.0, inf_is_valid: false, obstacle_max_range: 20.0, obstacle_min_range: 0.0, raytrace_max_range: 22.0, raytrace_min_range: 0.0,
          min_obstacle_height: -0.508, max_obstacle_height: 3.0}
        clear: {topic: /perception/points/clear, data_type: PointCloud2, marking: false, clearing: true, sensor_frame: '', observation_persistence: 0.0,
          expected_update_rate: 0.0, inf_is_valid: false, obstacle_max_range: 20.0, obstacle_min_range: 0.0, raytrace_max_range: 22.0, raytrace_min_range: 0.0,
          min_obstacle_height: -0.508, max_obstacle_height: 3.0}
      semantic_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: nondrivable natural manmade clear
        nondrivable: {topic: /perception/points/nondrivable, data_type: PointCloud2, marking: true, clearing: false, sensor_frame: '', observation_persistence: 0.0,
          expected_update_rate: 0.0, inf_is_valid: false, obstacle_max_range: 20.0, obstacle_min_range: 0.0, raytrace_max_range: 22.0, raytrace_min_range: 0.0,
          min_obstacle_height: -0.508, max_obstacle_height: 3.0}
        natural: {topic: /perception/points/natural, data_type: PointCloud2, marking: true, clearing: false, sensor_frame: '', observation_persistence: 0.0,
          expected_update_rate: 0.0, inf_is_valid: false, obstacle_max_range: 20.0, obstacle_min_range: 0.0, raytrace_max_range: 22.0, raytrace_min_range: 0.0,
          min_obstacle_height: -0.508, max_obstacle_height: 3.0}
        manmade: {topic: /perception/points/manmade, data_type: PointCloud2, marking: true, clearing: false, sensor_frame: '', observation_persistence: 0.0,
          expected_update_rate: 0.0, inf_is_valid: false, obstacle_max_range: 20.0, obstacle_min_range: 0.0, raytrace_max_range: 22.0, raytrace_min_range: 0.0,
          min_obstacle_height: -0.508, max_obstacle_height: 3.0}
        clear: {topic: /perception/points/clear, data_type: PointCloud2, marking: false, clearing: true, sensor_frame: '', observation_persistence: 0.0,
          expected_update_rate: 0.0, inf_is_valid: false, obstacle_max_range: 20.0, obstacle_min_range: 0.0, raytrace_max_range: 22.0, raytrace_min_range: 0.0,
          min_obstacle_height: -0.508, max_obstacle_height: 3.0}
      vru_inflation: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 1.5, inflation_radius: 3.0}
      vehicle_inflation: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 2.0, inflation_radius: 2.0}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 4.0, inflation_radius: 2.4}
