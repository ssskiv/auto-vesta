navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 10.0
    delay: 0.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0               # Webots InertialUnit is ENU (yaw 0 = east)
    zero_altitude: true
    broadcast_cartesian_transform: false
    publish_filtered_gps: false
    use_odometry_yaw: false
    wait_for_datum: true
    # datum = map origin (matches sim_sensor_adapter). TODO(user): real venue lat/lon/heading
    datum: [54.3282, 48.3866, 0.0]
