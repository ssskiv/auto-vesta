# Nav2 params for Lada Vesta in Webots (ROS 2 Humble).
# Frames: map -(static, nav2.launch.py)-> odom -(vesta_driver, GPS+IMU)-> base_link.
# base_link is at the rear axle, 0.4 m above ground, so the ground plane sits at
# z ~= -0.4 in odom/map; obstacle heights below are relative to that.

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""  # overridden by the `map` launch arg
    topic_name: map
    frame_id: map

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      motion_model_for_search: "DUBIN"  # Ackermann, forward only
      minimum_turning_radius: 3.9       # WHEELBASE / tan(MAX_STEER) = 2.648 / tan(0.6)
      tolerance: 0.5
      downsample_costmap: false
      allow_unknown: true
      max_planning_time: 5.0
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 5.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      smooth_path: true

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.5
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 3.0
      lookahead_dist: 4.0
      min_lookahead_dist: 3.0
      max_lookahead_dist: 6.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.5
      approach_velocity_scaling_dist: 2.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 4.0
      regulated_linear_scaling_min_speed: 0.5
      use_rotate_to_heading: false  # car can't turn in place
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      rolling_window: false
      track_unknown_space: true
      resolution: 0.1
      # Body boxes from vesta.urdf: x in [-0.88, 3.68], y in +-0.865, plus margin.
      footprint: "[[3.7, 0.9], [3.7, -0.9], [-0.9, -0.9], [-0.9, 0.9]]"
      # plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: lidar
        lidar:
          topic: /lidar
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.0
          max_obstacle_height: 1.6
          obstacle_max_range: 25.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 2.0
        cost_scaling_factor: 2.0
      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.5
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.1
      footprint: "[[3.7, 0.9], [3.7, -0.9], [-0.9, -0.9], [-0.9, 0.9]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: lidar
        lidar:
          topic: /lidar
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.0
          max_obstacle_height: 1.6
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 2.0
        cost_scaling_factor: 2.0
      always_send_full_costmap: True
