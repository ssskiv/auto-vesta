# keywords: vehicle/wheel
# Model of the Lada Vesta wheels using the generic VehicleWheel PROTO including physic properties and baseColorMaps.
# Tire/rim radii correspond to a stock 185/65R15 fitment.

EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2022b/projects/vehicles/protos/abstract/VehicleWheel.proto"
EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2022b/projects/vehicles/protos/abstract/GenericTireAppearance.proto"

PROTO LadaVestaWheel [
  field       SFString name           "Lada Vesta wheel"  # Is `VehicleWheel.name`.
  field       SFNode   physics        NULL            # Is `VehicleWheel.physics`.
  field       SFBool   boundingObject TRUE            # Is `VehicleWheel.boundingObject`.
  field       SFBool   wheelSide      FALSE           # Is `VehicleWheel.wheelSide`.
  hiddenField SFFloat  tireRadius     0.315           # Is `VehicleWheel.tireRadius`. We need to make this value 'visible' to the car PROTO so that the tire radius can be sent to the controller.
]
{
  VehicleWheel {
    name IS name
    thickness 0.2
    tireRadius IS tireRadius
    rimRadius 0.19
    rimBeamWidth 0.09
    centralInnerRadius 0.07
    centralOuterRadius 0.13
    rimBeamThickness 0.06
    rimBeamOffset 0.047
    wheelSide IS wheelSide
    tireAppearance GenericTireAppearance {
    }
    rimAppearance PBRAppearance {
      baseColor 0.7 0.7 0.7
      roughness 0.5
    }
    physics IS physics
    boundingObject IS boundingObject
    logoSlot [
      Pose {
        translation 0 0.035 0
        rotation 1 0 0 1.570796
        children [
          Shape {
            appearance PBRAppearance {
              metalness 0
              baseColorMap ImageTexture {
                url [
                  "../resource/textures/gerb.png"
                ]
              }
            }
            geometry Cylinder {
              bottom FALSE
              height 0.15
              radius 0.026
              side FALSE
              subdivision 24
            }
          }
        ]
      }
    ]
  }
}