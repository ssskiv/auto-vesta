    let ok = true;
    for (const b of barriers)
      for (const p of b)
        for (const q of c)
          if (Math.hypot(p[0] - q[0], p[1] - q[1]) - 2 * R < GAP)   // 18.27: edge to edge >= L + W
            ok = false;
    if (ok)
