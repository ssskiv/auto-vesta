# =========================================================================
# RU: Базовая конфигурация. Настройки видеокарты подключаются отдельным
#     файлом: compose.nvidia.yml, compose.amd.yml, compose.intel.yml или
#     compose.cpu.yml. Makefile (`make`) выбирает его сам.
#
# EN: Base configuration. GPU settings come from a separate overlay file:
#     compose.nvidia.yml, compose.amd.yml, compose.intel.yml or
#     compose.cpu.yml. The Makefile (`make`) picks one
#     automatically.
# =========================================================================
services:
  sim:
    build:
      context: .
      dockerfile: Dockerfile
    # RU: Сначала source docker/image.sh. EN: First source docker/image.sh.
    image: ${VESTA_IMAGE:-ghcr.io/ssskiv/vesta-sim:nav2ai}
    pull_policy: never
    container_name: vesta_sim
    hostname: vesta-sim

    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      # RU: Сокет Wayland (если сессия Wayland). EN: Wayland socket (if the session is Wayland).
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
      - PULSE_SERVER=${PULSE_SERVER:-}

    volumes:
      - ../ros2_ws/src:/ros2_ws/src:rw
      # RU: точка входа берётся из репозитория (правки без пересборки образа).
      # EN: the entrypoint comes from the repo (edits need no image rebuild).
      - ./entrypoint.sh:/entrypoint.sh:ro
      # RU: rviz открывается с ros2_ws/src/rviz/default.rviz.
      # EN: rviz starts with ros2_ws/src/rviz/default.rviz.
      - ../ros2_ws/src/rviz:/root/.rviz2:rw
      # RU: Артефакты сборки живут на хосте: пересборка не нужна при
      #     каждом запуске контейнера.
      # EN: Build artifacts live on the host, so the workspace is not
      #     rebuilt on every container start.
      - ../.build/build:/ros2_ws/build:rw
      - ../.build/install:/ros2_ws/install:rw
      - ../.build/log:/ros2_ws/log:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    ports:
      # RU: Панель управления и API. EN: Control panel and API.
      - "8080:8080"

    # RU: Gazebo и DDS активно используют разделяемую память.
    # EN: Gazebo and DDS rely heavily on shared memory.
    ipc: host
    shm_size: '2gb'

    stdin_open: true
    tty: true
    command: bash
