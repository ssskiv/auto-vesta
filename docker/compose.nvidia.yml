# RU: NVIDIA. Требует nvidia-container-toolkit на хосте.
#     Библиотеки драйвера пробрасываются с хоста, ставить их в образ не нужно.
# EN: NVIDIA. Requires nvidia-container-toolkit on the host.
#     Driver libraries are injected from the host; no need to install them.
services:
  sim:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      # RU: гибридная графика (X-сервер на встроенной GPU): рендер на NVIDIA через PRIME offload.
      # EN: hybrid graphics (X server on the integrated GPU): render on NVIDIA via PRIME offload.
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __VK_LAYER_NV_optimus=NVIDIA_only
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, display]
